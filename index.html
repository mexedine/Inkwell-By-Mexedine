  --ink:#2D2A32;
  --yellow:#FFD93D;
  --pink:#FF8FAB;
  --blue:#6CB4EE;
  --green:#8AC926;
  --orange:#FF9F1C;
  --purple:#B388FF;
  --surface:#FFFDF8;
  --card:#FFFDF8;
  --muted:#6B5B7A;
  --shadow-soft:0 2px 8px rgba(45,42,50,0.08);
  --safe-l:env(safe-area-inset-left, 0px);
  --safe-r:env(safe-area-inset-right, 0px);
  --safe-b:env(safe-area-inset-bottom, 0px);
  --line:#2D2A32;
  --ui-size:16px;
  --ui-density:14px;
  --editor-width:1180px;
}

@media (prefers-color-scheme: dark){
  :root{
    --paper:#FFF6E5;
    --paper-2:#FFF9E6;
    --desk:#E7D9B0;
    --surface:#FFFDF8;
    --card:#FFFDF8;
    --ink:#2D2A32;
    --muted:#6B5B7A;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Patrick Hand','Gochi Hand',cursive;
  font-size:var(--ui-size);
  line-height:1.4
}

button,input,select,textarea{
  font-family:inherit;
  line-height:1.4
}

button{
  cursor:pointer;
  min-height:44px
}

button:active{
  transform:scale(0.97)
}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid var(--ink);
  outline-offset:2px
}

.wobbly{
  border:2px solid var(--ink);
  box-shadow:var(--shadow-soft);
  border-radius:255px 15px 225px 15px / 15px 225px 15px 255px
}

.wobbly-2{
  border:2px solid var(--ink);
  box-shadow:var(--shadow-soft);
  border-radius:15px 225px 15px 255px / 225px 15px 255px 15px
}

.wobbly-3{
  border:2px solid var(--ink);
  box-shadow:var(--shadow-soft);
  border-radius:225px 20px 255px 20px / 20px 255px 20px 225px
}

.paper-bg{
  background-color:var(--paper);
  background-image:radial-gradient(#e8d9b0 1.2px, transparent 1.3px), repeating-linear-gradient(0deg, transparent 0 31px, rgba(45,42,50,.08) 31px 32px);
  background-size:34px 34px, 100% 32px
}

.wood-bg{
  background-color:var(--desk);
  background-image:repeating-linear-gradient(90deg, rgba(120,90,40,.10) 0 3px, transparent 3px 58px), repeating-linear-gradient(0deg, rgba(255,255,255,.18) 0 2px, transparent 2px 26px)
}

.crayon-btn{
  border:2px solid var(--ink);
  box-shadow:var(--shadow-soft);
  border-radius:999px;
  padding:10px 14px;
  font-weight:700;
  line-height:1.4;
  min-height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  white-space:normal;
  text-align:center
}

.crayon-btn:active{
  transform:scale(0.97)
}

.chip{
  border:2px solid var(--ink);
  border-radius:999px;
  padding:10px 12px;
  background:var(--card);
  font-weight:700;
  min-height:44px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  line-height:1.4
}

input[type=range]{
  accent-color:var(--ink);
  width:100%
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

.tilt-l{
  transform:rotate(-1.2deg)
}

.tilt-r{
  transform:rotate(1.1deg)
}

.canvas-wrap{
  background:#FFFDF8;
  border:2px solid var(--ink);
  box-shadow:var(--shadow-soft);
  border-radius:16px;
  overflow:hidden
}

.contrast-high{
  filter:contrast(1.18) saturate(1.12)
}

@keyframes inkwell-wobble{
  0%,100%{
    transform:rotate(-1.6deg) translateY(0)
  }

  25%{
    transform:rotate(1.4deg) translateY(-3px)
  }

  50%{
    transform:rotate(-1deg) translateY(1px)
  }

  75%{
    transform:rotate(1.8deg) translateY(-2px)
  }
}

@keyframes inkwell-squiggle{
  from{
    stroke-dashoffset:560
  }

  to{
    stroke-dashoffset:0
  }
}

@keyframes inkwell-bounce{
  0%,100%{
    transform:translateY(0) rotate(-4deg)
  }

  50%{
    transform:translateY(-14px) rotate(5deg)
  }
}

@keyframes inkwell-fade{
  to{
    opacity:0;
    visibility:hidden
  }
}

.loading-wobble{
  animation:inkwell-wobble 1.1s ease-in-out infinite
}

.loading-squiggle{
  stroke-dasharray:560;
  animation:inkwell-squiggle 1.15s ease forwards
}

.loading-dot{
  animation:inkwell-bounce .62s ease-in-out infinite
}

.loading-dot:nth-child(2){
  animation-delay:.12s
}

.loading-dot:nth-child(3){
  animation-delay:.24s
}

.loading-fade{
  animation:inkwell-fade .35s ease .05s forwards
}

/* Book opening — CSS 3D, no fade */

.book-scene{
  perspective:1200px;
  perspective-origin:50% 50%
}

.book{
  position:relative;
  transform-style:preserve-3d;
  transition:transform .7s ease-out
}

.book-page{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  background:var(--paper);
  border:3px solid var(--ink);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:22px;
  text-align:center;
  box-shadow:6px 6px 0 rgba(45,42,50,.18)
}

.book-page-left{
  transform-origin:left center;
  transition:transform .7s ease-out;
  z-index:3
}

.book-open .book-page-left{
  transform:rotateY(-180deg)
}

.book-page-right{
  transform-origin:right center;
  transition:transform .7s ease-out;
  z-index:2
}

.book-open .book-page-right{
  transform:rotateY(12deg) translateX(6px)
}

.book-spine{
  position:absolute;
  left:50%;
  top:0;
  bottom:0;
  width:4px;
  margin-left:-2px;
  background:rgba(45,42,50,.35);
  z-index:4;
  box-shadow:0 0 0 1px rgba(45,42,50,.12)
}

.desk-shell{
  background:#FFF6E5
}

.desk-topbar{
  height:44px;
  min-height:44px;
  background:rgba(255,246,229,.88);
  backdrop-filter:blur(8px);
  border-bottom:2px solid rgba(45,42,50,.9);
  transition:transform .25s ease, opacity .25s ease
}

.desk-topbar.hidden-bar{
  transform:translateY(-100%);
  opacity:0;
  pointer-events:none
}

.desk-pill{
  height:52px;
  min-height:52px;
  background:rgba(255,253,244,.96);
  backdrop-filter:blur(8px);
  border:2.5px solid var(--ink);
  box-shadow:2px 2px 0 var(--ink);
  border-radius:999px;
  display:flex;
  align-items:center;
  gap:4px;
  padding:4px 8px;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-x;
  scrollbar-width:none
}

.desk-pill::-webkit-scrollbar{
  display:none
}

.desk-pill button{
  min-height:40px;
  min-width:68px;
  padding:10px 14px;
  white-space:nowrap;
  flex-shrink:0;
  flex-grow:0;
  scroll-snap-align:start;
  overflow:visible;
  text-overflow:clip
}

.pill-wrap{
  position:relative;
  max-width:calc(100vw - 16px);
  width:-moz-fit-content;
  width:fit-content
}

.pill-fade{
  position:absolute;
  right:2px;
  top:0;
  bottom:0;
  width:28px;
  border-radius:0 999px 999px 0;
  background:linear-gradient(90deg,transparent,rgba(255,253,244,.95));
  pointer-events:none;
  z-index:2
}

.desk-topbar button{
  min-width:44px;
  min-height:36px;
  white-space:nowrap;
  flex-shrink:0
}

.desk-topbar .top-title{
  flex:1 1 auto;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.desk-sheet{
  height:42vh;
  min-height:28vh;
  max-height:42vh;
  background:rgba(255,249,230,.97);
  backdrop-filter:blur(10px);
  border-top:3px solid var(--ink);
  border-left:3px solid var(--ink);
  border-right:3px solid var(--ink);
  border-radius:22px 22px 0 0;
  box-shadow:0 -6px 0 rgba(45,42,50,.12)
}

.sheet-handle{
  width:52px;
  height:6px;
  border-radius:999px;
  background:rgba(45,42,50,.45);
  margin:7px auto 4px
}

.info-chip{
  height:28px;
  background:rgba(255,255,255,.8);
  backdrop-filter:blur(6px);
  border:2px solid var(--ink);
  border-radius:999px;
  padding:0 9px;
  font-size:12px;
  font-weight:700;
  display:flex;
  align-items:center;
  white-space:nowrap
}

.sheet-row{
  height:32px;
  display:flex;
  align-items:center;
  gap:8px
}

.sheet-row input[type=range]{
  height:32px
}

.compact-card{
  border:2px solid var(--ink);
  border-radius:12px;
  padding:7px 8px;
  background:#fff
}
